services:
  # -------------------------------------------------------------
  # Backend API Service (FastAPI + AI Proctoring + RAG Engine)
  # -------------------------------------------------------------
  - type: web
    name: ai-interview-backend
    runtime: python
    buildCommand: uv sync --frozen --no-dev --extra proctoring && uv cache prune --ci
    startCommand: uv run --no-dev --extra proctoring uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: UV_PROJECT_ENVIRONMENT
        value: .pradnya_venv
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Recruiter Admin
      - key: PROCTOR_MAX_WARNINGS
        value: "5"
      - key: PROCTOR_WARN_COOLDOWN
        value: "20.0"

  # -------------------------------------------------------------
  # Frontend Static Application (React + Vite)
  # -------------------------------------------------------------
  - type: static
    name: ai-interview-frontend
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-interview-backend
          property: url
