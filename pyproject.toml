[project]
name = "adaptive-interview-platform"
version = "0.1.0"
description = "Adaptive interview platform with RAG-based question selection"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.9,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "email-validator>=2.2,<3",
  "openai>=3.24.0",
  "pymongo>=4.18.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.ruff.lint.per-file-ignores]
"backend/app/api/**/*.py" = ["B008"]
